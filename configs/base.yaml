project_name: HQVR Long-Video Retrieval

analysis:
  shot_detector: adaptive
  adaptive_threshold: 3.0
  content_threshold: 27.0
  min_scene_len_frames: 8

  # Sparse frame sampling for visual-change statistics.
  sample_interval_sec: 0.5
  resize_width: 160
  resize_height: 90

profiling:
  # Overlapping local windows. These windows are ONLY for profiling,
  # not final retrieval segments.
  window_sec: 60.0
  stride_sec: 30.0

  # Pair-wise frame delta below this value is considered visually static.
  # Delta is mean absolute grayscale difference normalized to [0, 1].
  static_delta_threshold: 0.020

  # Heuristic regime thresholds. These are research defaults, not claimed optimal.
  static:
    max_cuts_per_min: 0.25
    min_static_pair_ratio: 0.75

  high_cut:
    min_cuts_per_min: 10.0
    max_median_shot_sec: 4.0

  low_cut:
    max_cuts_per_min: 2.0
    min_median_shot_sec: 20.0
